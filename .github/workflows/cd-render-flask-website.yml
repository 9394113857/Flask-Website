# ============================================================
# 🚀 CD PIPELINE - FLASK WEBSITE SERVICE
#
# Features:
#
# ✅ CI repository dispatch trigger
# ✅ Daily 2 AM IST health verification
# ✅ Manual trigger
# ✅ Docker tag deployment
# ✅ Health check
# ✅ Automatic rollback
# ✅ Dynamic deployment metadata
# ✅ Success email
# ✅ Rollback email
#
# ============================================================


name: 🚀 CD Flask Website Deployment



# ============================================================
# EVENTS
# ============================================================


on:


  repository_dispatch:


    types:


      - deploy-release




  # Runs daily at 2:00 AM IST
  # GitHub Actions uses UTC
  # 20:30 UTC = 02:00 IST


  schedule:


    - cron: "30 20 * * *"




  workflow_dispatch:





# ============================================================
# JOBS
# ============================================================


jobs:



  deploy:



    name: 🚀 Deploy With Automatic Rollback


    runs-on: ubuntu-latest





    steps:




      # ======================================================
      # CHECKOUT
      # ======================================================


      - name: 📥 Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true





      # ======================================================
      # GET DEPLOYMENT DETAILS
      # ======================================================


      - name: 🏷️ Get Deployment Metadata

        run: |


          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV


          echo "COMMIT=${{ github.event.client_payload.commit }}" >> $GITHUB_ENV


          echo "BRANCH=${{ github.event.client_payload.branch }}" >> $GITHUB_ENV


          echo "BUILD_TIME_UTC=${{ github.event.client_payload.build_time_utc }}" >> $GITHUB_ENV


          echo "BUILD_TIME_IST=${{ github.event.client_payload.build_time_ist }}" >> $GITHUB_ENV


          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV





      # ======================================================
      # GET PREVIOUS TAG
      # ======================================================


      - name: 🔙 Find Previous Version

        if: github.event_name == 'repository_dispatch'

        run: |


          CURRENT=${VERSION}


          PREVIOUS=$(git tag --sort=-version:refname | grep -v ${CURRENT} | head -1)


          echo "PREVIOUS_VERSION=${PREVIOUS}" >> $GITHUB_ENV


          echo "Previous version: ${PREVIOUS}"







      # ======================================================
      # DAILY HEALTH CHECK ONLY
      # ======================================================


      - name: ❤️ Daily Health Verification


        if: github.event_name == 'schedule'


        run: |


          echo "Daily health verification"


          curl --fail "${{ secrets.APPLICATION_HEALTH_URL }}"








      # ======================================================
      # DEPLOY NEW VERSION
      # ======================================================


      - name: 🚀 Deploy Current Version


        if: github.event_name == 'repository_dispatch'


        run: |


          echo "Deploying ${VERSION}"


          curl -X POST \

          -H "Content-Type: application/json" \

          -d "{\"tag\":\"${VERSION}\"}" \

          "${{ secrets.RENDER_DEPLOY_HOOK }}"







      # ======================================================
      # HEALTH CHECK
      # ======================================================


      - name: ❤️ Application Health Check


        id: health


        if: github.event_name == 'repository_dispatch'


        continue-on-error: true


        run: |


          echo "Waiting for deployment..."


          sleep 60


          curl --fail "${{ secrets.APPLICATION_HEALTH_URL }}"







      # ======================================================
      # AUTOMATIC ROLLBACK
      # ======================================================


      - name: 🔄 Automatic Rollback


        if: steps.health.outcome == 'failure'


        run: |


          echo "Deployment failed"


          echo "Rolling back to ${PREVIOUS_VERSION}"



          curl -X POST \

          -H "Content-Type: application/json" \

          -d "{\"tag\":\"${PREVIOUS_VERSION}\"}" \

          "${{ secrets.RENDER_DEPLOY_HOOK }}"







      # ======================================================
      # FINAL HEALTH CHECK
      # ======================================================


      - name: 🔎 Verify Final Production


        if: always()


        run: |


          echo "Final production status"


          curl "${{ secrets.APPLICATION_HEALTH_URL }}"







      # ======================================================
      # SUCCESS EMAIL
      # ======================================================


      - name: 📧 Send CD Success Email


        if: steps.health.outcome == 'success'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}


          server_port: ${{ secrets.SMTP_PORT }}


          secure: true


          username: ${{ secrets.SMTP_USERNAME }}


          password: ${{ secrets.SMTP_PASSWORD }}


          from: ${{ secrets.SMTP_USERNAME }}


          to: ${{ secrets.EMAIL_TO }}


          subject: "🚀 CD SUCCESS | Flask Website ${{ env.VERSION }}"


          body: |


            🚀 DEPLOYMENT SUCCESS


            ============================


            Repository:

            ${{ github.repository }}


            Version:

            ${{ env.VERSION }}


            Commit:

            ${{ env.COMMIT }}


            Branch:

            ${{ env.BRANCH }}


            Build UTC:

            ${{ env.BUILD_TIME_UTC }}


            Build IST:

            ${{ env.BUILD_TIME_IST }}


            Deployment UTC:

            ${{ env.DEPLOY_TIME_UTC }}


            Deployment IST:

            ${{ env.DEPLOY_TIME_IST }}


            Health:

            ${{ secrets.APPLICATION_HEALTH_URL }}


            Status:

            🟢 PRODUCTION HEALTHY







      # ======================================================
      # ROLLBACK EMAIL
      # ======================================================


      - name: 📧 Send Rollback Email


        if: steps.health.outcome == 'failure'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}


          server_port: ${{ secrets.SMTP_PORT }}


          secure: true


          username: ${{ secrets.SMTP_USERNAME }}


          password: ${{ secrets.SMTP_PASSWORD }}


          from: ${{ secrets.SMTP_USERNAME }}


          to: ${{ secrets.EMAIL_TO }}


          subject: "⚠️ CD ROLLBACK | Flask Website ${{ env.VERSION }}"


          body: |


            ⚠️ DEPLOYMENT FAILED


            ============================


            Automatic rollback executed.


            Failed Version:

            ${{ env.VERSION }}


            Rollback Version:

            ${{ env.PREVIOUS_VERSION }}


            Commit:

            ${{ env.COMMIT }}


            Branch:

            ${{ env.BRANCH }}


            Build UTC:

            ${{ env.BUILD_TIME_UTC }}


            Build IST:

            ${{ env.BUILD_TIME_IST }}


            Deployment UTC:

            ${{ env.DEPLOY_TIME_UTC }}


            Deployment IST:

            ${{ env.DEPLOY_TIME_IST }}


            Health:

            ${{ secrets.APPLICATION_HEALTH_URL }}


            Status:

            🔄 ROLLBACK COMPLETED
