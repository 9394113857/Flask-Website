# ============================================================
# 🚀 CD PIPELINE - FLASK WEBSITE SERVICE
#
# Features:
#
# ✅ CI repository dispatch trigger
# ✅ Daily 2 AM IST verification trigger
# ✅ Manual trigger
# ✅ Deploy Docker version
# ✅ Health check
# ✅ Automatic rollback
# ✅ Detailed deployment logs
# ✅ Success email
# ✅ Rollback email
#
# ============================================================


name: 🚀 CD Flask Website Deployment



# ============================================================
# EVENTS
# ============================================================


on:


  repository_dispatch:


    types:


      - deploy-release



  # Daily 2 AM IST
  # IST = UTC +5:30
  # 2:00 AM IST = 20:30 UTC previous day

  schedule:


    - cron: "30 20 * * *"



  workflow_dispatch:





# ============================================================
# JOB
# ============================================================


jobs:


  deploy:


    name: 🚀 Deploy With Automatic Rollback


    runs-on: ubuntu-latest



    steps:



      # ======================================================
      # CHECKOUT
      # ======================================================


      - name: 📥 Checkout Repository


        uses: actions/checkout@v4





      # ======================================================
      # METADATA
      # ======================================================


      - name: 🏷️ Load Deployment Metadata


        run: |


          echo "================================="
          echo "🏷️ DEPLOYMENT METADATA"
          echo "================================="


          VERSION="${{ github.event.client_payload.version }}"


          if [ -z "$VERSION" ]; then

            VERSION=$(git describe --tags --abbrev=0)

          fi


          echo "VERSION=$VERSION" >> $GITHUB_ENV


          echo "COMMIT=${{ github.event.client_payload.commit }}" >> $GITHUB_ENV


          echo "BRANCH=main" >> $GITHUB_ENV


          echo "BUILD_TIME_UTC=${{ github.event.client_payload.build_time_utc }}" >> $GITHUB_ENV


          echo "BUILD_TIME_IST=${{ github.event.client_payload.build_time_ist }}" >> $GITHUB_ENV


          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV



          echo "Version: $VERSION"

          echo "Branch: main"

          echo "================================="





      # ======================================================
      # PREVIOUS VERSION
      # ======================================================


      - name: 💾 Load Previous Version


        run: |


          echo "================================="

          echo "🔄 Loading rollback version"

          echo "================================="


          echo "PREVIOUS_VERSION=${{ secrets.ROLLBACK_VERSION }}" >> $GITHUB_ENV


          echo "Rollback Version: ${{ secrets.ROLLBACK_VERSION }}"







      # ======================================================
      # DEPLOY
      # ======================================================


      - name: 🚀 Deploy Current Version


        run: |


          echo "================================="

          echo "🚀 STARTING DEPLOYMENT"

          echo "Version: ${VERSION}"

          echo "Commit: ${COMMIT}"

          echo "Branch: ${BRANCH}"

          echo "================================="



          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"tag\":\"${VERSION}\"}" \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"



          echo "Deployment request sent"







      # ======================================================
      # HEALTH CHECK
      # ======================================================


      - name: ❤️ Application Health Check


        id: health


        continue-on-error: true


        run: |


          echo "================================="

          echo "❤️ HEALTH CHECK STARTED"

          echo "${{ secrets.APPLICATION_HEALTH_URL }}"

          echo "================================="



          sleep 60



          curl --fail "${{ secrets.APPLICATION_HEALTH_URL }}"



          echo "Application Healthy"







      # ======================================================
      # ROLLBACK
      # ======================================================


      - name: 🔄 Automatic Rollback


        if: steps.health.outcome == 'failure'


        run: |


          echo "================================="

          echo "⚠️ HEALTH CHECK FAILED"

          echo "ROLLBACK STARTED"

          echo "Target: ${PREVIOUS_VERSION}"

          echo "================================="



          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"tag\":\"${PREVIOUS_VERSION}\"}" \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"



          echo "Rollback completed"







      # ======================================================
      # FINAL VERIFY
      # ======================================================


      - name: 🔎 Final Production Verification


        if: always()


        run: |


          echo "================================="

          echo "🔎 FINAL PRODUCTION STATUS"

          echo "================================="



          curl --fail "${{ secrets.APPLICATION_HEALTH_URL }}"







      # ======================================================
      # SUCCESS EMAIL
      # ======================================================


      - name: 📧 Send CD Success Email


        if: steps.health.outcome == 'success'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          to: ${{ secrets.EMAIL_TO }}


          subject: |
            🚀 CD SUCCESS | Flask Website ${ { env.VERSION } }


          body: |

            🚀 DEPLOYMENT SUCCESS

            ============================


            Repository:

            ${{ github.repository }}


            Version:

            ${{ env.VERSION }}


            Commit:

            ${{ env.COMMIT }}


            Branch:

            ${{ env.BRANCH }}


            Build UTC:

            ${{ env.BUILD_TIME_UTC }}


            Build IST:

            ${{ env.BUILD_TIME_IST }}


            Deploy UTC:

            ${{ env.DEPLOY_TIME_UTC }}


            Deploy IST:

            ${{ env.DEPLOY_TIME_IST }}


            Health URL:

            ${{ secrets.APPLICATION_HEALTH_URL }}


            Status:

            🟢 PRODUCTION HEALTHY







      # ======================================================
      # ROLLBACK EMAIL
      # ======================================================


      - name: 📧 Send Rollback Email


        if: steps.health.outcome == 'failure'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          to: ${{ secrets.EMAIL_TO }}


          subject: |
            ⚠️ CD ROLLBACK | Flask Website ${ { env.VERSION } }


          body: |

            ⚠️ DEPLOYMENT FAILED

            ============================


            Failed Version:

            ${{ env.VERSION }}


            Rollback Version:

            ${{ env.PREVIOUS_VERSION }}


            Commit:

            ${{ env.COMMIT }}


            Branch:

            ${{ env.BRANCH }}


            Deploy UTC:

            ${{ env.DEPLOY_TIME_UTC }}


            Deploy IST:

            ${{ env.DEPLOY_TIME_IST }}


            Health URL:

            ${{ secrets.APPLICATION_HEALTH_URL }}


            Status:

            🔄 ROLLBACK COMPLETED
