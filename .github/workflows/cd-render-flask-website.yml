# ============================================================
# 🚀 CD PIPELINE - FLASK WEBSITE SERVICE
#
# Deployment Strategy:
#
# CD DOES NOT RUN ON TAG PUSH.
#
# CI gives deployment permission after Docker image is ready.
#
#
# Trigger sources:
#
#       ✅ CI repository dispatch
#       ✅ Daily verification
#       ✅ Manual execution
#
#
# Deployment:
#
#       v1.0.5
#
#       Includes:
#
#       ✅ Version
#       ✅ Commit SHA
#       ✅ Branch
#       ✅ Build Information
#       ✅ Deployment Notification
#
#
# ============================================================


name: 🚀 CD Flask Website Deployment





# ============================================================
# EVENTS
# ============================================================


on:


  # ----------------------------------------------------------
  # Triggered only by successful CI
  #
  # CI completes:
  #
  #       Docker build
  #       Docker push
  #
  # Then CD starts.
  #
  # ----------------------------------------------------------


  repository_dispatch:


    types:


      - deploy-release






  # ----------------------------------------------------------
  # Daily deployment verification
  #
  # Runs every day at 04:00 UTC
  #
  # ----------------------------------------------------------


  schedule:


    - cron: "0 4 * * *"






  # ----------------------------------------------------------
  # Manual deployment
  #
  # ----------------------------------------------------------


  workflow_dispatch:









# ============================================================
# JOBS
# ============================================================


jobs:




  # ==========================================================
  # 🚀 DEPLOY JOB
  # ==========================================================


  deploy:


    name: 🚀 Deploy With Notification


    runs-on: ubuntu-latest





    steps:





      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------


      - name: 📥 Checkout Repository


        uses: actions/checkout@v4







      # ------------------------------------------------------
      # Receive CI Metadata
      #
      # Comes from repository_dispatch payload
      #
      # ------------------------------------------------------


      - name: 🏷️ Get Deployment Metadata


        run: |


          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV


          echo "COMMIT=${{ github.event.client_payload.commit }}" >> $GITHUB_ENV


          echo "BRANCH=${{ github.event.client_payload.branch }}" >> $GITHUB_ENV


          echo "BUILD_TIME_UTC=${{ github.event.client_payload.build_time_utc }}" >> $GITHUB_ENV


          echo "BUILD_TIME_IST=${{ github.event.client_payload.build_time_ist }}" >> $GITHUB_ENV







      # ------------------------------------------------------
      # Deployment Time
      # ------------------------------------------------------


      - name: ⏱️ Set Deployment Time


        run: |


          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV







      # ------------------------------------------------------
      # Deployment safety hold
      #
      # Gives time before production deployment.
      #
      # ------------------------------------------------------


      - name: ⏳ Deployment Safety Hold


        run: |


          echo "Holding deployment before production..."


          sleep 120







      # ------------------------------------------------------
      # Deploy Application
      #
      # Calls Render deployment webhook.
      #
      # Sends Docker version tag.
      #
      # ------------------------------------------------------


      - name: 🚀 Deploy Application


        run: |


          echo "Deploying version: ${VERSION}"


          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"tag\":\"${VERSION}\"}" \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"









      # ------------------------------------------------------
      # Deployment Email Notification
      #
      # Sent after successful Render deployment trigger.
      #
      # ------------------------------------------------------


      - name: 📧 Send Deployment Success Email


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}


          server_port: ${{ secrets.SMTP_PORT }}


          username: ${{ secrets.SMTP_USERNAME }}


          password: ${{ secrets.SMTP_PASSWORD }}


          subject: |

            🚀 Deployment Successful - Flask Website Service ${{ env.VERSION }}


          to: ${{ secrets.EMAIL_TO }}


          from: ${{ secrets.SMTP_USERNAME }}


          body: |


            Production Deployment Completed Successfully


            ========================================


            Repository:

            ${{ github.repository }}



            Version:

            ${{ env.VERSION }}



            Branch:

            ${{ env.BRANCH }}



            Commit SHA:

            ${{ env.COMMIT }}



            Docker Image:

            pythoncodelife/flask-website-service:${{ env.VERSION }}



            Build Time UTC:

            ${{ env.BUILD_TIME_UTC }}



            Build Time IST:

            ${{ env.BUILD_TIME_IST }}



            Deployment Time UTC:

            ${{ env.DEPLOY_TIME_UTC }}



            Deployment Time IST:

            ${{ env.DEPLOY_TIME_IST }}



            Deployment Platform:

            Render



            Trigger:

            ${{ github.event_name }}



            Status:

            SUCCESS








      # ------------------------------------------------------
      # Deployment Summary
      # ------------------------------------------------------


      - name: 📋 Deployment Summary


        run: |


          echo "================================="


          echo "🚀 Deployment Completed"


          echo ""


          echo "Repository:"


          echo "${{ github.repository }}"


          echo ""


          echo "Version:"


          echo "${VERSION}"


          echo ""


          echo "Commit:"


          echo "${COMMIT}"


          echo ""


          echo "Branch:"


          echo "${BRANCH}"


          echo ""


          echo "Deployment Time:"


          echo "${DEPLOY_TIME_IST}"


          echo ""


          echo "================================="
