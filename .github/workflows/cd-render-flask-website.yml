# ============================================================
# 🚀 CD PIPELINE - FLASK WEBSITE SERVICE
#
# Features:
#
# ✅ CI repository dispatch trigger
# ✅ Daily verification trigger
# ✅ Manual trigger
# ✅ Deploy Docker version
# ✅ Health check
# ✅ Automatic rollback
# ✅ Success email
# ✅ Rollback email
#
# ============================================================


name: 🚀 CD Flask Website Deployment



# ============================================================
# EVENTS
# ============================================================


on:


  repository_dispatch:


    types:


      - deploy-release




  schedule:


    - cron: "0 4 * * *"




  workflow_dispatch:





# ============================================================
# JOBS
# ============================================================


jobs:



  deploy:



    name: 🚀 Deploy With Automatic Rollback


    runs-on: ubuntu-latest





    steps:




      # ======================================================
      # CHECKOUT
      # ======================================================


      - name: 📥 Checkout Repository

        uses: actions/checkout@v4






      # ======================================================
      # GET DEPLOYMENT DETAILS
      # ======================================================


      - name: 🏷️ Get Deployment Metadata

        run: |


          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV


          echo "COMMIT=${{ github.event.client_payload.commit }}" >> $GITHUB_ENV


          echo "BRANCH=main" >> $GITHUB_ENV


          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV





      # ======================================================
      # STORE PREVIOUS VERSION
      # ======================================================


      - name: 💾 Load Previous Version

        run: |


          echo "PREVIOUS_VERSION=${{ secrets.ROLLBACK_VERSION }}" >> $GITHUB_ENV





      # ======================================================
      # DEPLOYMENT WAIT
      # ======================================================


      - name: ⏳ Deployment Safety Hold

        run: |


          echo "Waiting before deployment..."


          sleep 120






      # ======================================================
      # DEPLOY NEW VERSION
      # ======================================================


      - name: 🚀 Deploy New Version

        run: |


          echo "Deploying version ${VERSION}"


          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"tag\":\"${VERSION}\"}" \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"






      # ======================================================
      # HEALTH CHECK
      # ======================================================


      - name: ❤️ Application Health Check

        id: health


        continue-on-error: true


        run: |


          echo "Checking application..."


          sleep 60


          curl --fail "${{ secrets.APPLICATION_HEALTH_URL }}"






      # ======================================================
      # AUTOMATIC ROLLBACK
      # ======================================================


      - name: 🔄 Automatic Rollback

        if: steps.health.outcome == 'failure'


        run: |


          echo "Health check failed"


          echo "Rolling back to ${PREVIOUS_VERSION}"



          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"tag\":\"${PREVIOUS_VERSION}\"}" \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"







      # ======================================================
      # SUCCESS EMAIL
      # ======================================================


      - name: 📧 Send CD Success Email


        if: steps.health.outcome == 'success'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}


          server_port: ${{ secrets.SMTP_PORT }}


          secure: true


          username: ${{ secrets.SMTP_USERNAME }}


          password: ${{ secrets.SMTP_PASSWORD }}


          from: ${{ secrets.SMTP_USERNAME }}


          to: ${{ secrets.EMAIL_TO }}


          subject: "✅ CD SUCCESS | Flask Website"


          body: |


            🚀 DEPLOYMENT SUCCESS


            Repository:
            ${{ github.repository }}


            Version:
            ${{ env.VERSION }}


            Commit:
            ${{ env.COMMIT }}


            Branch:
            ${{ env.BRANCH }}


            Deployment UTC:
            ${{ env.DEPLOY_TIME_UTC }}


            Deployment IST:
            ${{ env.DEPLOY_TIME_IST }}


            Status:
            SUCCESS







      # ======================================================
      # ROLLBACK EMAIL
      # ======================================================


      - name: 📧 Send Rollback Email


        if: steps.health.outcome == 'failure'


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: ${{ secrets.SMTP_SERVER }}


          server_port: ${{ secrets.SMTP_PORT }}


          secure: true


          username: ${{ secrets.SMTP_USERNAME }}


          password: ${{ secrets.SMTP_PASSWORD }}


          from: ${{ secrets.SMTP_USERNAME }}


          to: ${{ secrets.EMAIL_TO }}


          subject: "⚠️ CD ROLLBACK | Flask Website"


          body: |


            ⚠️ DEPLOYMENT FAILED


            AUTOMATIC ROLLBACK EXECUTED


            Repository:
            ${{ github.repository }}


            Failed Version:
            ${{ env.VERSION }}


            Rollback Version:
            ${{ env.PREVIOUS_VERSION }}


            Commit:
            ${{ env.COMMIT }}


            Branch:
            ${{ env.BRANCH }}


            Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}


            Time IST:
            ${{ env.DEPLOY_TIME_IST }}


            Status:
            ROLLBACK COMPLETED
