# ============================================================
# 🚀 CI PIPELINE - FLASK WEBSITE SERVICE
#
# Workflow:
#
# Normal push:
#       ✅ Install dependencies
#       ✅ Run tests
#
# Pull Request:
#       ✅ Install dependencies
#       ✅ Run tests
#
# Version tag:
#
#       v1.0.0
#       v1.0.1
#
#       ✅ Run tests
#       ✅ Generate build metadata
#       ✅ Build Docker image
#       ✅ Push version image
#       ✅ Push latest image
#       ✅ Send CI email notification
#
# Docker push NEVER happens on normal commits.
#
# CI STOPS after Docker image push.
#
# CD is completely independent and is NOT triggered by CI.
#
# ============================================================

name: 🚀 CI Flask Website Service

# ============================================================
# EVENTS
# ============================================================

on:

  push:

    branches:

      - "**"

    tags:

      - "v*"

  pull_request:

  workflow_dispatch:

# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 🧪 TEST JOB
  # ==========================================================

  test:

    name: 🧪 Application Tests

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 📥 CHECKOUT
      # ======================================================

      - name: 📥 Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true

      # ======================================================
      # 🐍 PYTHON
      # ======================================================

      - name: 🐍 Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      # ======================================================
      # 📦 INSTALL DEPENDENCIES
      # ======================================================

      - name: 📦 Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest

      # ======================================================
      # 🔍 PROJECT STRUCTURE
      # ======================================================

      - name: 🔍 Show Project Structure

        run: |

          pwd

          ls -la

          find . -maxdepth 2 -type d

      # ======================================================
      # 🧪 RUN TESTS
      # ======================================================

      - name: 🧪 Run Tests

        env:

          PYTHONPATH: .

        run: |

          pytest -v

  # ==========================================================
  # 🐳 DOCKER RELEASE JOB
  # ==========================================================

  docker-release:

    name: 🐳 Build And Push Docker Image

    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true

      - name: 🔐 Docker Hub Login

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ======================================================
      # 🏷️ BUILD METADATA
      # ======================================================

      - name: 🏷️ Set Build Metadata

        run: |

          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "BRANCH=main" >> $GITHUB_ENV

          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "BUILD_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV      - name: 📄 Generate Build Info

        run: |

          cat > build_info.json << EOF

          {
            "version": "${VERSION}",
            "commit": "${COMMIT}",
            "branch": "${BRANCH}",
            "build_time_utc": "${BUILD_TIME_UTC}",
            "build_time_ist": "${BUILD_TIME_IST}"
          }

          EOF

      # ======================================================
      # 🐳 BUILD DOCKER IMAGE
      # ======================================================

      - name: 🐳 Build Docker Image

        run: |

          docker build \
            -t pythoncodelife/flask-website-service:${VERSION} .

      # ======================================================
      # 📤 PUSH VERSION IMAGE
      # ======================================================

      - name: 📤 Push Version Image

        run: |

          docker push pythoncodelife/flask-website-service:${VERSION}

      # ======================================================
      # 🏷️ CREATE LATEST TAG
      # ======================================================

      - name: 🏷️ Create Latest Tag

        run: |

          docker tag \
            pythoncodelife/flask-website-service:${VERSION} \
            pythoncodelife/flask-website-service:latest

      # ======================================================
      # 📤 PUSH LATEST IMAGE
      # ======================================================

      - name: 📤 Push Latest Image

        run: |

          docker push pythoncodelife/flask-website-service:latest

      # ======================================================
      # 📧 CI SUCCESS EMAIL
      # ======================================================

      - name: 📧 Send CI Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}

          to: ${{ secrets.EMAIL_TO }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: |
            ✅ CI SUCCESS | Flask Website ${{ env.VERSION }}

          body: |

            🚀 CI PIPELINE COMPLETED SUCCESSFULLY

            =====================================

            Repository:
            ${{ github.repository }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Docker Image:
            pythoncodelife/flask-website-service:${{ env.VERSION }}

            Latest Image:
            pythoncodelife/flask-website-service:latest

            Build UTC:
            ${{ env.BUILD_TIME_UTC }}

            Build IST:
            ${{ env.BUILD_TIME_IST }}

            Triggered By:
            ${{ github.actor }}

            Event:
            ${{ github.event_name }}

            Status:
            ✅ SUCCESS

            Docker images have been published successfully.

            CI pipeline completed.

      # ======================================================
      # 📧 CI FAILURE EMAIL
      # ======================================================

      - name: 📧 Send CI Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}

          to: ${{ secrets.EMAIL_TO }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: |
            ❌ CI FAILED | Flask Website

          body: |

            ❌ CI PIPELINE FAILED

            =====================================

            Repository:
            ${{ github.repository }}

            Ref:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Triggered By:
            ${{ github.actor }}

            Event:
            ${{ github.event_name }}

            Please review the GitHub Actions logs for the failure details.
